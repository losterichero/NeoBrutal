<!DOCTYPE html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{fragments/layout :: html(title='标签列表', content = ~{::content}, header = ~{fragments/header::content}, navbar = ~{}, ajaxscrolljs = ~{})}"
>
  <th:block th:fragment="content">
    <div class="nei_top"></div>
    <section class="post-loop">
      <div class="container">
        <div class="post-box">
          <div id="tags" class="mod-archive-name">标签列表</div>
          <div class="post_loop tags-flow">
            <th:block th:each="tag : ${tags}">
            <a class="post_list tag-card" th:href="@{${tag.status?.permalink}}" th:title="${tag.spec?.displayName}">
              <i class="bi bi-tags tag-watermark" aria-hidden="true"></i>
              <span class="tag-name" th:text="${tag.spec?.displayName}">标签名</span>
            </a>
            </th:block>
          </div>
        </div>
      </div>
    </section>
  </th:block>
</html>
