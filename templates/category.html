<!DOCTYPE html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{fragments/layout :: html(title=${category.spec.displayName}, content = ~{::content}, header = ~{fragments/header::content}, navbar = ~{}, ajaxscrolljs = ~{::ajaxscrolljs})}"
>
  <th:block th:fragment="content">
    <div class="nei_top"></div>
    <section class="post-loop">
      <div class="container">
        <div class="post-box">
          <div class="post-box-txt">
            <h3 class="latest_post"><span th:text="${category.spec?.displayName}">分类名称</span><span class="count-badge"><i class="bi bi-file-earmark-text" aria-hidden="true"></i>共<span th:text="${category.postCount}"></span>篇文章</span></h3>
            <p class="category-desc" th:if="${not #strings.isEmpty(category.spec?.description)}" th:text="${category.spec?.description}"></p>
          </div>
          <div class="post_loop" th:classappend="${theme.config?.layout?.post_columns == 'two' ? 'two-col' : ''}">
            <th:block th:insert="~{fragments/posts :: post(${posts})}"></th:block>
          </div>
          <th:block th:if="${theme.config?.styles?.need_ajax_scroll}">
          <div class="no-more">没有更多了~</div>
          <div id="spinner" class="spinner">
              <div class="spinner-grow" role="status">
                  <span class="visually-hidden"></span>
              </div>
          </div>
          </th:block>
          <th:block th:insert="~{fragments/posts :: pagination}"></th:block>
        </div>
      </div>
    </section>
  </th:block>
  <th:block th:fragment="ajaxscrolljs" th:insert="~{fragments/ajaxscrolljs :: ajaxscrolljs}"></th:block>
</html>
