<!DOCTYPE html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{fragments/layout :: html(title=${post.spec.title}, content = ~{::content}, header = ~{fragments/header::content}, navbar = ~{}, ajaxscrolljs = ~{})}"
>



  <th:block th:fragment="content">
    <div class="nei_top"></div>
    <section class="post-loop">
      <div class="container">
        <div class="post-box">
          <div class="post_list post_head_title">
            <div class="post_beici" th:data-text="${post.spec?.title}"></div>
            <h1 th:text="${post.spec?.title}"></h1>
            <div class="post_loop_info">
              <span class="author" itemprop="author" itemscope th:each="contributor : ${post?.contributors}">
                <i class="bi bi-person-fill" aria-hidden="true"></i><a th:text="${contributor?.displayName}"></a>
              </span>
              <span><i class="bi bi-stopwatch" aria-hidden="true"></i><th:block th:text="${#temporals.format(post.spec?.publishTime, 'yyyy-MM-dd')}"></th:block></span>
              <span><i class="bi bi-fonts" aria-hidden="true"></i><th:block th:text="${#strings.length(post.content?.content)}"></th:block></span>
              <span><i class="bi bi-eye" aria-hidden="true"></i><th:block th:text="${post.stats?.visit}"></th:block></span>
            </div>
          </div>
          <div class="post-content-wrap">
            <article class="post-markdown-style" th:utext="${post.content?.content}">
            </article>
            <nav class="post-toc" id="postToc" aria-label="文章目录">
              <div class="post-toc-title">目录</div>
              <ol class="post-toc-list"></ol>
            </nav>
          </div>
          <div class="post_tag">
            <div class="mt-4">
              <th:block th:each="tag : ${post.tags}">
              <a th:href="@{${tag.status?.permalink}}" th:text="${tag.spec?.displayName}"></a>
              </th:block>
            </div>
          </div>
          <div class="post-next-prev row" th:with="postCursor = ${postFinder.cursor(post.metadata.name)}">
            <div class="post-prev" th:if="${postCursor.hasPrevious()}">
              <div class="next_prev_beici">PREV</div><a th:href="@{${postCursor.previous.status.permalink}}" th:text="${postCursor.previous.spec.title}"></a>
            </div>
            <div class="post-next" th:if="${postCursor.hasNext()}">
              <div class="next_prev_beici">NEXT</div><a th:href="@{${postCursor.next.status.permalink}}" th:text="${postCursor.next.spec.title}"></a>
            </div>
          </div>
          <div class="post-comment">
            <halo:comment
              group="content.halo.run"
              kind="Post"
              th:name="${post.metadata?.name}"
            />
          </div>
        </div>
      </div>
    </section>

    <button type="button" class="post-toc-toggle" id="postTocToggle" aria-label="打开目录">
      <span>目录</span>
    </button>
    <div class="post-toc-drawer" id="postTocDrawer" aria-hidden="true">
      <div class="post-toc-drawer-head">
        <span>目录</span>
        <button type="button" class="post-toc-close" aria-label="关闭目录"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
      </div>
      <ol class="post-toc-list"></ol>
    </div>
    <div class="post-toc-mask" id="postTocMask" hidden></div>

    <div class="post-action-bar" id="postActionBar">
      <button type="button" class="post-action post-like-btn" data-post-name="${post.metadata?.name}" data-upvote-url="@{/apis/api.halo.run/v1alpha1/trackers/upvote}" aria-label="点赞">
        <i class="bi bi-hand-thumbs-up" aria-hidden="true"></i>
        <b class="post-badge post-like-badge" th:text="${post.stats?.upvote}">0</b>
      </button>
      <span class="post-action-divider" aria-hidden="true"></span>
      <button type="button" class="post-action post-comment-btn" aria-label="评论">
        <i class="bi bi-chat-dots" aria-hidden="true"></i>
        <b class="post-badge post-comment-badge" th:text="${post.stats?.comment}">0</b>
      </button>
    </div>
  </th:block>
 
</html>
