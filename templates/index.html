<!DOCTYPE html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{fragments/layout :: html(title=${site.title}, content = ~{::content}, header = ~{fragments/header::content}, navbar = ~{}, ajaxscrolljs = ~{::ajaxscrolljs})}"
>
  <th:block th:fragment="content">
      <section id="banner" class="carousel slide" data-bs-ride="carousel"  th:if="${not #arrays.isEmpty(theme.config.styles.banners)}">
        <div class="carousel-indicators">
          <button th:each="feature, index : ${theme.config.styles.banners}" type="button" data-bs-target="#banner" th:data-bs-slide-to="${index.index}" th:class="${index.index} == 0?'active':''"></button>
        </div>
        <div class="carousel-inner">
          <div th:each="feature, index : ${theme.config.styles.banners}" th:class="${index.index} == 0?'carousel-item active':'carousel-item'">
            <div class="container">
              <div class="row justify-content-center">
                <div class="col-md-10">
                  <div class="banner_loop">
                    <div class="beici" th:data-text="${feature.title}"></div>
                    <h2>
                      <a th:href="${feature.link}" th:title="${feature.title}" th:text="${feature.title}"></a>
                    </h2>
                    <div class="banner_loop_info">
                      <p th:text="${feature.subtitle}"></p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#banner" data-bs-slide="prev">
          <i class="bi bi-chevron-compact-left"></i>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#banner" data-bs-slide="next">
          <i class="bi bi-chevron-compact-right"></i>
        </button>
      </section>
    <div class="nei_top" th:if="${#arrays.isEmpty(theme.config.styles.banners)}"></div>
    <section class="post-loop">
      <div class="container">

        <div class="post-box">

          <div class="top-section" th:if="${theme.config?.base_info?.show_info_bar != false and theme.config?.base_info?.show_info_bar != 'false'}">
           <!-- <div class="top-section-title">关于</div> -->
            <div class="top-section-box" th:with="base_info = ${theme.config?.base_info}">
              <div class="top-section-left">
                <div class="display_user" th:with="user = ${contributorFinder.getContributor(base_info?.display_user)},
                     displayName=${#strings.trim(user?.displayName)},
                     letterName=${#strings.isEmpty(displayName) ? '' : displayName.replaceAll('^[^\p{L}\p{N}]+', '')},
                     initial=${#strings.isEmpty(letterName) ? '#' : #strings.substring(letterName, 0, 1)},
                     hasAvatar=${!#strings.isEmpty(user?.avatar)}"
                     th:classappend="${hasAvatar} ? '' : 'no-avatar'">
                  <img th:if="${hasAvatar}" th:src="@{${user?.avatar}}" th:alt="${displayName}"
                       onerror="this.closest('.display_user').classList.add('no-avatar')">
                  <div class="avatar-fallback" th:text="${initial}"></div>
                  <div>
                    <div class="name" th:text="${user?.displayName}"></div>
                    <div class="bio" th:text="${user?.bio}"></div>
                  </div>
                </div>
           

              </div>

              <div class="media-accounts" th:if="${base_info != null and !#arrays.isEmpty(base_info.media_accounts)}">
                <div class="account" th:each="item : ${base_info?.media_accounts}"
                     th:with="hasLogo=${!#strings.isEmpty(item.logo)},
                              displayName=${#strings.trim(item.name)},
                              letterName=${#strings.isEmpty(displayName) ? '' : displayName.replaceAll('^[^\p{L}\p{N}]+', '')},
                              initial=${#strings.isEmpty(letterName) ? '#' : #strings.substring(letterName, 0, 1)}"
                     th:classappend="${hasLogo} ? '' : 'no-logo'">
                  <a th:href="@{${item.url}}" th:title="${displayName}">
                    <img th:if="${hasLogo}" th:src="@{${item.logo}}" th:alt="${displayName}"
                         onerror="this.closest('.account').classList.add('no-logo')">
                    <div class="account-fallback" th:text="${initial}"></div>
                  </a>
                </div>

              </div>
              <div class="top-section-right">
                <div class="running-time-box">站点已运行：<span class="running-time">0 天 00 小时 00 分钟 00 秒。</span></div>
                <ul class="site-status" th:with="stats = ${siteStatsFinder.getStats()}">
                  <li >文章数量: <span th:text="${stats.post}"></span> </li>
                  <li>浏览量:<span  th:text="${ stats.visit}"></span> </li>
                </ul>
              </div>
            </div>

          </div>

          <div class="post-box-txt">

            <h3 class="latest_post">最新文章</h3>
          </div>
          <div class="post_loop" th:classappend="${theme.config?.layout?.post_columns == 'two' ? 'two-col' : ''}">
            <th:block th:insert="~{fragments/posts :: post(${posts})}"></th:block>
          </div>
          <th:block th:if="${theme.config?.styles?.need_ajax_scroll}">
          <div class="no-more">没有更多了~</div>
          <div id="spinner" class="spinner">
              <div class="spinner-grow" role="status">
                  <span class="visually-hidden"></span>
              </div>
          </div>
          </th:block>
          <th:block th:insert="~{fragments/posts :: pagination}"></th:block>
        </div>
      </div>
    </section>

    <div th:with="base_info = ${theme.config?.base_info}"> 
      <script   th:inline="javascript" >
        let dateString  = [[${base_info?.site_running_time}]]

        // 缓存时间
        sessionStorage.setItem('dateString',dateString)
        const date = sessionStorage.getItem('dateString')

        const runningTimeElement = document.querySelector('.running-time');

        function timeBetweenDates(dateString) {
          const givenDate = new Date(dateString);
          const currentDate = new Date();

          const timeDifference = Math.max(0, currentDate - givenDate);

          const days = Math.floor(timeDifference / (1000 * 60 * 60 * 24));
          const hours = Math.floor((timeDifference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
          const minutes = Math.floor((timeDifference % (1000 * 60 * 60)) / (1000 * 60));
          const seconds = Math.floor((timeDifference % (1000 * 60)) / 1000);

          return {days, hours, minutes, seconds}
        }

        // 用 0 补位，保证动画过程中数字宽度不跳动
        function formatRunningTime({days, hours, minutes, seconds}, dayWidth) {
          const pad = (value, length) => String(value).padStart(length, '0');
          return `${pad(days, dayWidth)} 天 ${pad(hours, 2)} 小时 ${pad(minutes, 2)} 分钟 ${pad(seconds, 2)} 秒。`;
        }

        function initRunningTime() {
          const givenDate = new Date(date);
          if (!runningTimeElement || isNaN(givenDate.getTime())) {
            return;
          }

          const target = timeBetweenDates(date);
          const dayWidth = Math.max(1, String(target.days).length);

          // 先用 0 占位，再进行数字累加动画
          runningTimeElement.innerText = formatRunningTime({days: 0, hours: 0, minutes: 0, seconds: 0}, dayWidth);

          const duration = 1500;
          let startTime = null;
          const easeOutCubic = progress => 1 - Math.pow(1 - progress, 3);

          function animate(timestamp) {
            if (startTime === null) {
              startTime = timestamp;
            }
            const progress = Math.min((timestamp - startTime) / duration, 1);
            const eased = easeOutCubic(progress);

            runningTimeElement.innerText = formatRunningTime({
              days: Math.floor(target.days * eased),
              hours: Math.floor(target.hours * eased),
              minutes: Math.floor(target.minutes * eased),
              seconds: Math.floor(target.seconds * eased)
            }, dayWidth);

            if (progress < 1) {
              requestAnimationFrame(animate);
            } else {
              // 动画结束后切换为每秒实时走时
              const updateTimeDifference = () => {
                runningTimeElement.innerText = formatRunningTime(timeBetweenDates(date), dayWidth);
              };
              updateTimeDifference();
              setInterval(updateTimeDifference, 1000);
            }
          }

          requestAnimationFrame(animate);
        }

        initRunningTime();
      </script>
  
    </div>
  </th:block>
  <th:block th:fragment="ajaxscrolljs" th:insert="~{fragments/ajaxscrolljs :: ajaxscrolljs}"></th:block>



  
</html>
