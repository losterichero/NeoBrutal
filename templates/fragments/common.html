<th:block th:fragment="menu_main">
  <nav class="header-menu">
    <ul class="header-menu-ul" th:with="menuItems = ${menuFinder.getPrimary().menuItems}">
      <th:block th:each="menuItem : ${menuItems}">
        <li class="menu-item" th:if="${menuItem.children.size() == 0}">
          <a  th:href="@{${menuItem.status.href}}"
          th:text="${menuItem.status.displayName}"
          ></a>
        </li>
        <!-- 二级菜单 -->
        <li class="menu-item menu-item-has-children" th:if="${menuItem.children.size() > 0}">
          <a href="javascript:;"
            th:text="${menuItem.status.displayName}"
            ></a>
          <ul class="sub-menu">
            <li th:each="item : ${menuItem.children}">
              <a th:href="@{${item.status.href}}"
              th:text="${item.status.displayName}"></a>
            </li>
          </ul>
        </li>
      </th:block>

    </ul>



  </nav>
  <div class="top_icon" style="display: flex;">
    <div class="top_icon_btn theme-switch d-none d-lg-flex" onclick="switchDarkMode()"><i
        class="bi bi-moon-stars-fill"></i></div>
    <div class="top_icon_btn collapsed" type="button" onclick="SearchWidget.open();"><i class="bi bi-search collapse-show"></i><i
        class="bi bi-x-circle collapse-hide"></i></div>
    <button class="top_icon_btn d-lg-none" type="button" data-bs-toggle="offcanvas"
      data-bs-target="#right-canvas"><i class="bi bi-list"></i></button>
  </div>
</th:block>
<th:block th:fragment="menu_right">
  <div class="offcanvas offcanvas-end" id="right-canvas" style="width: 80%;">
    <div class="sidebar_canvas">
      <div class="right-slide-header" style="justify-content: flex-end;">
        <button type="button" class="theme-switch" onclick="switchDarkMode()"><i
            style="font-size: 18px;margin-right: 20px;" class="bi bi-moon-stars-fill"></i></button>
        <button type="button" data-bs-dismiss="offcanvas" aria-label="Close"><i class="bi bi-x"></i></button>
      </div>
      <div class="sidebar_box" style="height: calc(100vh - 127px);">

        <ul class="nav nav-tabs sider-tabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="sider-menu-tab" data-bs-toggle="tab"
              data-bs-target="#sider-menu-panel" type="button" role="tab"
              aria-controls="sider-menu-panel" aria-selected="true">菜单</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="sider-archive-tab" data-bs-toggle="tab"
              data-bs-target="#sider-archive-panel" type="button" role="tab"
              aria-controls="sider-archive-panel" aria-selected="false">分类标签</button>
          </li>
        </ul>
        <div class="tab-content sider-tab-content">
          <div class="tab-pane active" id="sider-menu-panel" role="tabpanel" aria-labelledby="sider-menu-tab" th:with="menu = ${menuFinder.getPrimary()}">
            <div class="sider-collapse" th:with="menuItems = ${menu.menuItems}" data-accordion>
              <div th:each="menuItem : ${menuItems}">
                <div class="sider-collapse-item" th:if="${menuItem.children.size() == 0}">
                  <a th:href="@{${menuItem.status.href}}"
                  th:target="${menuItem.spec.target?.value}" >
                  <h2 class="siderNav-menu-item item-bg " th:text="${menuItem.status.displayName}">一级菜单（无子菜单）</h2>
                </a>
              </div>
              <div class="sider-collapse-item" th:if="${menuItem.children.size() > 0}">
                <h2 class="sider-collapse-title item-bg" th:text="${menuItem.status.displayName}">一级菜单（有子菜单）</h2>
                <div class="sider-collapse-content">
                  <ul class="siderNav-sub-menu" th:with="items = ${menuItem.children}">
                    <li th:each="item : ${items}">
                      <a class="menu-item"
                        th:href="@{${item.status.href}}"
                        th:text="${item.status.displayName}"
                      ></a>
                      </li>
                  </ul>
                </div>
              </div>
              </div>
            </div>

          </div>

          <div class="tab-pane" id="sider-archive-panel" role="tabpanel" aria-labelledby="sider-archive-tab">
            <aside id="nav_menu-2" class="widget widget_nav_menu">
              <h3 class="widget-title">分类</h3>
              <div class="menu-category-container">
                <ul class="menu" th:with="categories = ${categoryFinder.listAll()}">
                  <li th:each="category : ${categories}">
                    <a class="menu-item"
                      th:href="@{${category.status.permalink}}"
                      th:text="${category.spec.displayName}"
                    ></a>
                    </li>
                </ul>
              </div>
            </aside>


          </div>
        </div>

      </div>
    </div>
  </div>
</th:block>
